<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline | TruWork</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f9fafb;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #fff;
        border-radius: 12px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      img { width: 48px; height: 48px; }
      h1 { margin: 16px 0 8px; font-size: 20px; color: #0b1f3b; }
      p { margin: 0; font-size: 14px; line-height: 1.5; color: #4b5563; }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #c62828;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/branding/truwork-monogram.svg" alt="TruWork" />
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Jobs and invoices you've
        already opened are still available. Check your connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
